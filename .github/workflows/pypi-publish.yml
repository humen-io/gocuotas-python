# Publicación en PyPI mediante Trusted Publishing (OIDC).
# Configuración en https://pypi.org/manage/account/publishing/ :
#   - PyPI: "Add a new pending publisher" para el proyecto "gocuotas"
#   - Owner: humen-io, Repository: gocuotas-python
#   - Workflow name: pypi-publish.yml (este archivo)
#   - Environment name: vacío (este workflow no usa GitHub Environments)
# Cada versión en pyproject.toml solo se puede subir una vez; bump de version antes de publicar.

name: Publish to PyPI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install and run tests
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          pytest -q

  publish:
    name: Build and upload to PyPI
    runs-on: ubuntu-latest
    needs: test
    if: |
      (github.event_name == 'release' && github.event.action == 'published') ||
      github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build
        run: python -m pip install -U pip build

      - name: Build sdist and wheel
        run: python -m build --sdist --wheel --outdir dist .

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
