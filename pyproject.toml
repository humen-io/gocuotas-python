[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gocuotas"
version = "0.1.0"
description = "GoCuotas API Client V1 and Redirect V1 HTTP clients (Python)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "humen-io" }]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://github.com/humen-io/gocuotas-python"
Repository = "https://github.com/humen-io/gocuotas-python"
Issues = "https://github.com/humen-io/gocuotas-python/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
